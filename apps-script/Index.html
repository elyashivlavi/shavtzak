<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f9fafb; --card: #ffffff; --text: #111827; --muted: #6b7280;
    --border: #e5e7eb; --accent: #2563eb; --accent-soft: #eff6ff;
    --guard: #b45309; --guard-soft: #fffbeb; --patrol: #047857; --patrol-soft: #f0fdfa;
    --danger: #b91c1c; --danger-soft: #fef2f2; --wa: #25D366; --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Heebo", -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  header {
    background: var(--card); padding: 12px 18px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .who { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    padding: 8px 16px; border-radius: 999px; background: var(--card); cursor: pointer;
    font-size: 14px; border: 1px solid var(--border); user-select: none; font-weight: 500;
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .block-title { font-size: 15px; font-weight: 700; margin: 2px 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
  .pill.guard { background: var(--guard-soft); color: var(--guard); }
  .pill.patrol { background: var(--patrol-soft); color: var(--patrol); }
  .pill.standby { background: var(--danger-soft); color: var(--danger); }
  .pill.count { background: var(--accent-soft); color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .chip.guard { background: var(--guard-soft); color: var(--guard); }
  .chip.patrol { background: var(--patrol-soft); color: var(--patrol); }
  .datenav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .datenav button { padding: 8px 14px; }
  .datenav input[type=date] { width: auto; font-weight: 600; text-align: center; }
  .joinleave { display: flex; gap: 8px; flex-wrap: wrap; }
  .joinleave label { display: flex; flex-direction: column; gap: 2px; }
  .joinleave input { width: auto; font-size: 12px; padding: 4px 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .row-guard td:first-child { border-inline-start: 3px solid var(--guard); }
  .mine { background: var(--accent-soft); border-radius: 6px; font-weight: 600; }
  button {
    background: var(--accent); color: #fff; border: none; padding: 9px 16px;
    border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  button.secondary { background: #f3f4f6; color: var(--text); }
  button.danger { background: var(--danger); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  input, select {
    background: #fff; color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 11px; font-size: 14px; font-family: inherit; width: 100%;
  }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; align-items: end; }
  .muted { color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
  .banner {
    padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px;
    background: var(--guard-soft); color: var(--guard); border: 1px solid #fde68a;
  }
  .now-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .now-status { font-size: 20px; font-weight: 700; }
  .contact-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .contact-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .contact-btn.call { background: var(--accent-soft); color: var(--accent); }
  .contact-btn.wa { background: rgba(37,211,102,.14); color: #128C4B; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #111827; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; transition: opacity .25s; z-index: 100;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger); }
  .spinner { text-align: center; padding: 40px; color: var(--muted); }
  .kv { font-size: 13px; color: var(--muted); }
  .inactive { opacity: .45; }
</style>
</head>
<body>
<header>
  <h1>🪖 שבצ"ק מוצב</h1>
  <div class="who" id="who"></div>
</header>

<main>
  <div id="loading" class="spinner">טוען את השיבוץ…</div>
  <div id="app" class="hidden">
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
var ADMIN_TTL = 24 * 60 * 60 * 1000; // תוקף מצב מנהל: 24 שעות
function loadAdminPw() {
  try { var a = JSON.parse(localStorage.getItem('shavtzak_admin') || 'null'); if (a && a.pw && (Date.now() - a.ts) < ADMIN_TTL) return a.pw; } catch (e) {}
  return '';
}
function saveAdminPw(pw) { try { localStorage.setItem('shavtzak_admin', JSON.stringify({ pw: pw, ts: Date.now() })); } catch (e) {} }
function clearAdminPw() { try { localStorage.removeItem('shavtzak_admin'); } catch (e) {} }
var STATE = { boot: null, adminPw: loadAdminPw(), includeDraft: true,
  selectedId: (function () { try { return localStorage.getItem('shavtzak_soldier') || ''; } catch (e) { return ''; } })() };
var CURRENT_TAB = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

function toast(msg, isErr) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(function () { t.className = 'toast'; }, 3200);
}

// admin-privileged call — appends the stored password as the last argument
function callAdmin(fn, args, cb) {
  google.script.run
    .withSuccessHandler(function (res) { if (cb) cb(res); })
    .withFailureHandler(function (err) { toast(err.message || 'שגיאה', true); })
    [fn].apply(null, (args || []).concat([STATE.adminPw]));
}

function loadBoot(cb) {
  google.script.run
    .withSuccessHandler(function (boot) { STATE.boot = boot; if (cb) cb(); })
    .withFailureHandler(function (err) {
      document.getElementById('loading').textContent = 'שגיאה בטעינה: ' + (err.message || err);
    })
    .getBootstrap(STATE.adminPw);
}

window.onload = function () { loadBoot(render); };
function reload() { loadBoot(render); }

function render() {
  var b = STATE.boot;
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  var isAdmin = b.user && b.user.isAdmin;
  if (STATE.adminPw && !isAdmin) { STATE.adminPw = ''; clearAdminPw(); } // סיסמה שמורה נדחתה/פגה
  document.getElementById('who').innerHTML = isAdmin
    ? '<span class="badge">מצב מנהל</span> <button class="ghost" style="padding:4px 10px;font-size:12px" onclick="adminLogout()">יציאה</button>'
    : '<button class="ghost" style="padding:4px 10px;font-size:12px" onclick="adminLogin()">מצב מנהל</button>';

  var tabs = [['personal', 'לוז אישי'], ['board', 'שבצק']];
  if (isAdmin) {
    tabs.push(['draft', 'טיוטה' + (b.hasDraft ? ' •' : '')]);
    tabs.push(['soldiers', 'חיילים']);
    tabs.push(['fairness', 'הוגנות']);
  }
  if (!CURRENT_TAB || !tabs.some(function (t) { return t[0] === CURRENT_TAB; })) CURRENT_TAB = tabs[0][0];

  var tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = tabs.map(function (t) {
    return '<div class="tab ' + (t[0] === CURRENT_TAB ? 'active' : '') + '" data-tab="' + t[0] + '">' + esc(t[1]) + '</div>';
  }).join('');
  Array.prototype.forEach.call(tabsEl.children, function (el) {
    el.onclick = function () { CURRENT_TAB = el.getAttribute('data-tab'); render(); };
  });

  var c = document.getElementById('content');
  if (CURRENT_TAB === 'personal') { c.innerHTML = viewPersonal(); wirePersonal(); }
  else if (CURRENT_TAB === 'board') { c.innerHTML = viewBoard(); wireBoard(); }
  else if (CURRENT_TAB === 'draft') { c.innerHTML = viewDraft(); wireDraft(); }
  else if (CURRENT_TAB === 'soldiers') { c.innerHTML = viewSoldiers(); wireSoldiers(); }
  else if (CURRENT_TAB === 'fairness') { c.innerHTML = viewFairness(); wireFairness(); }
}

function roleName(r) {
  return { admin: 'מנהל', officer: 'קצין מוצב', sergeant: 'סמל', soldier: 'חייל', guest: 'אורח' }[r] || 'חייל';
}

// ---- מצב מנהל (סיסמה, ללא התחברות גוגל) ----
function adminLogin() {
  var pw = prompt('סיסמת מנהל:');
  if (pw == null) return;
  STATE.adminPw = pw;
  loadBoot(function () {
    if (STATE.boot.user && STATE.boot.user.isAdmin) { saveAdminPw(pw); toast('מצב מנהל פעיל (24ש\')'); CURRENT_TAB = 'draft'; }
    else { STATE.adminPw = ''; clearAdminPw(); toast('סיסמה שגויה', true); }
    render();
  });
}
function adminLogout() { STATE.adminPw = ''; clearAdminPw(); CURRENT_TAB = 'board'; reload(); }

// ---- כלי יצירת קשר ----
function normPhone(p) { return String(p || '').replace(/[^\d]/g, ''); }
function waNumber(p) { var d = normPhone(p); if (d.indexOf('0') === 0) d = '972' + d.slice(1); return d; }
function contactRow(phone) {
  var d = normPhone(phone);
  if (!d) return '';
  return '<div class="contact-row">' +
    '<a class="contact-btn call" href="tel:' + esc(d) + '">📞 התקשר</a>' +
    '<a class="contact-btn wa" target="_blank" href="https://wa.me/' + esc(waNumber(phone)) + '">💬 וואטסאפ</a>' +
    '</div>';
}

// ---- לוז אישי ----
function rosterActive() { return (STATE.boot.roster || []); }
function soldierGuardItems_(soldierId) {
  var out = [];
  (STATE.boot.published || []).forEach(function (block) {
    block.guard.forEach(function (it) { if (it.soldier_id === soldierId) out.push({ b: block, it: it, kind: 'guard' }); });
    block.patrol.forEach(function (it) { if (it.soldier_id === soldierId) out.push({ b: block, it: it, kind: 'patrol' }); });
  });
  return out;
}

function viewPersonal() {
  var roster = rosterActive();
  var opts = '<option value="">— בחר חייל —</option>' + roster.map(function (s) {
    return '<option value="' + esc(s.id) + '"' + (s.id === STATE.selectedId ? ' selected' : '') + '>' + esc(s.name) + '</option>';
  }).join('');
  var picker = '<div class="card"><label class="muted">בחר חייל להצגת הלוז האישי</label>' +
    '<div style="margin-top:8px"><select id="soldier-pick">' + opts + '</select></div></div>';

  if (!STATE.selectedId) return picker + '<div class="card"><p class="muted">בחר חייל מהרשימה כדי לראות מתי הוא עולה ופרטי יצירת קשר.</p></div>';

  var me = null;
  roster.forEach(function (s) { if (s.id === STATE.selectedId) me = s; });
  var allItems = soldierGuardItems_(STATE.selectedId);
  var todayItems = allItems.filter(function (x) { return x.b.block_date === todayStr(); });
  var guards = todayItems.filter(function (x) { return x.kind === 'guard'; });  // "כרגע" תמיד לפי היום
  var dayItems = allItems.filter(function (x) { return x.b.block_date === STATE.boardDate; });  // הרשימה לפי בורר התאריך

  // "כרגע" — הערכה לפי שעון המכשיר מול משמרות השמירה של היום
  var now = new Date();
  var nowMin = now.getHours() * 60 + now.getMinutes();
  var onGuardNow = guards.some(function (x) {
    var s = hhToMin(x.it.start), e = hhToMin(x.it.end);
    return s != null && e != null && nowMin >= s && nowMin < e;
  });
  var onStandby = guards.some(function (x) { return truthy(x.it.standby); });
  var statusTxt = onGuardNow ? '🟠 בשמירה' : (guards.length ? '🟢 לא בשמירה כרגע' : '⚪ בפטרול / בבסיס');
  var rightPill = onStandby
    ? '<span class="pill standby">🔴 בכוננות 12:00–12:00</span>'
    : '<span class="pill count">' + esc(me ? roleName(me.role) : '') + '</span>';
  var nowCard = '<div class="card now-card"><div><div class="muted">כרגע</div><div class="now-status">' + statusTxt + '</div></div>' +
    rightPill + '</div>';

  var futureGuards = allItems.filter(function (x) { return x.kind === 'guard' && x.b.block_date >= todayStr(); });
  var next = futureGuards.length ? futureGuards[0] : null;
  var nextCard = next
    ? '<div class="card"><div class="muted">המשמרת הבאה</div><div class="now-status">🕓 ' +
        esc(next.it.start) + '–' + esc(next.it.end) + '</div>' +
        '<div class="muted">' + esc(next.b.block_date) + ' · ' + esc(next.it.day_label) + '</div></div>'
    : '';

  var listRows = dayItems.length ? dayItems.map(function (x) {
    var kind = x.kind === 'guard'
      ? '<span class="pill guard">שמירה</span>' + (truthy(x.it.standby) ? ' <span class="pill standby">כוננות 12:00–12:00</span>' : '')
      : '<span class="pill patrol">פטרול</span>';
    var time = x.kind === 'guard'
      ? esc(x.it.start) + '–' + esc(x.it.end) + ' (' + esc(x.it.day_label) + ')'
      : esc(x.it.day_label) + ' ' + esc(x.it.start);
    return '<div style="padding:7px 0;border-bottom:1px solid var(--border)">' + kind + ' <strong>' + time + '</strong> <span class="kv">· ' + esc(x.b.block_date) + '</span></div>';
  }).join('') : '<p class="muted">אין שיבוץ לתאריך זה.</p>';
  var listCard = '<div class="card"><h2>השיבוצים של ' + esc(me ? me.name : '') + '</h2>' + dateNavHtml() + listRows + '</div>';

  var contactCard = (me && normPhone(me.phone))
    ? '<div class="card"><h2>יצירת קשר</h2><div class="muted">' + esc(me.phone) + '</div>' + contactRow(me.phone) + '</div>'
    : '';

  return picker + nowCard + nextCard + contactCard + listCard;
}

function wirePersonal() {
  var sel = document.getElementById('soldier-pick');
  if (sel) sel.onchange = function () {
    STATE.selectedId = sel.value;
    try { localStorage.setItem('shavtzak_soldier', sel.value); } catch (e) {}
    render();
  };
  wireDateNav();
}

// ---- שבצק (לוח כללי) ----
function viewBoard() {
  var view = STATE.boot.published || [];
  if (!STATE.boardDate) STATE.boardDate = todayStr();

  var nav = dateNavHtml();

  if (!view.length) return nav + '<div class="card"><p class="muted">עדיין לא פורסם שיבוץ.</p></div>';

  var block = null, idx = -1;
  view.forEach(function (b, i) { if (b.block_date === STATE.boardDate) { block = b; idx = i; } });
  if (!block) return nav + '<div class="card"><p class="muted">אין שיבוץ לתאריך זה. נווט לתאריך אחר או צור שיבוץ.</p></div>';

  var effective = block.patrol.length ? (Object.keys(block.patrol.reduce(function (a, it) { a[it.soldier_id] = 1; return a; }, {})).length + standbySet_(block).length) : standbySet_(block).length;
  var header = '<div class="card now-card"><div><div class="muted">כוח אפקטיבי · ' + esc(block.block_date) + '</div><div class="now-status">' + effective + ' חיילים</div></div>' +
    '<div class="pill count">רוטציה 12:00–12:00</div></div>';
  var isAdmin = STATE.boot.user && STATE.boot.user.isAdmin;
  return nav + header + renderBoardBlock(block, view[idx - 1], isAdmin);
}

// ניווט תאריך משותף (שבצק + לוז אישי)
function dateNavHtml() {
  if (!STATE.boardDate) STATE.boardDate = todayStr();
  return '<div class="datenav">' +
    '<button class="ghost" id="bd-prev" aria-label="יום קודם">‹</button>' +
    '<input type="date" id="bd-date" value="' + esc(STATE.boardDate) + '">' +
    '<button class="ghost" id="bd-next" aria-label="יום הבא">›</button>' +
    '<button class="secondary" id="bd-today">היום</button></div>';
}
function wireDateNav() {
  var d = document.getElementById('bd-date');
  if (d) d.onchange = function () { STATE.boardDate = d.value; render(); };
  var p = document.getElementById('bd-prev');
  if (p) p.onclick = function () { STATE.boardDate = addDays(STATE.boardDate, -1); render(); };
  var n = document.getElementById('bd-next');
  if (n) n.onclick = function () { STATE.boardDate = addDays(STATE.boardDate, 1); render(); };
  var t = document.getElementById('bd-today');
  if (t) t.onclick = function () { STATE.boardDate = todayStr(); render(); };
}
function boardEditSelect(blockDate, slot, currentId) {
  var opts = (STATE.boot.soldiers || []).filter(function (s) { return s.active + '' !== 'FALSE' && s.active !== false; })
    .map(function (s) { return '<option value="' + esc(s.id) + '"' + (s.id === currentId ? ' selected' : '') + '>' + esc(s.name) + '</option>'; }).join('');
  return '<select class="board-edit" data-date="' + esc(blockDate) + '" data-slot="' + esc(slot) + '">' + opts + '</select>';
}
function wireBoard() {
  wireDateNav();
  Array.prototype.forEach.call(document.querySelectorAll('.board-edit'), function (sel) {
    sel.onchange = function () {
      callAdmin('editBoardAssignment', [sel.getAttribute('data-date'), sel.getAttribute('data-slot'), sel.value],
        function () { toast('עודכן ופורסם ✓'); reload(); });
    };
  });
}

// רשימת השומרים בכוננות (standby) של בלוק — כל חייל פעם אחת
function standbySet_(block) {
  if (!block) return [];
  var seen = {}, out = [];
  block.guard.forEach(function (it) {
    if (truthy(it.standby) && !seen[it.soldier_id]) { seen[it.soldier_id] = 1; out.push(it.soldier_name); }
  });
  return out;
}

function chipsHtml_(arr, cls) {
  if (!arr.length) return '<p class="muted">—</p>';
  return '<div class="chips">' + arr.map(function (n) {
    return '<span class="chip ' + cls + '">' + esc(n) + '</span>'; }).join('') + '</div>';
}

// לוח שבצק: שלושה כרטיסים לכל בלוק — עמדה / כוננות / פטרול. editable=מנהל יכול להחליף חייל.
// תצוגת העמדה מ-00:00 של היום הנבחר עד 12:00 למחרת (36ש') — משמרות אחרי-חצות מהבלוק הקודם + הבלוק הנוכחי.
function renderBoardBlock(block, prevBlock, editable) {
  var startDate = block.block_date;
  var seq = [];
  if (prevBlock) prevBlock.guard.forEach(function (it) {
    if (it.day_label === 'למחרת') seq.push({ it: it, date: startDate, blockDate: prevBlock.block_date }); // 00:00–12:00 של היום הנבחר
  });
  block.guard.forEach(function (it) {
    seq.push({ it: it, date: it.day_label === 'למחרת' ? addDays(startDate, 1) : startDate, blockDate: block.block_date });
  });

  var g = '<table><tr><th>יום</th><th>תאריך</th><th>שעות</th><th>חייל</th></tr>';
  seq.forEach(function (x) {
    var cell = editable ? boardEditSelect(x.blockDate, x.it.slot, x.it.soldier_id) : esc(x.it.soldier_name);
    g += '<tr class="row-guard"><td>' + hebDay(x.date) + '</td><td class="kv">' + fmtDM(x.date) + '</td><td>' +
         esc(x.it.start) + '–' + esc(x.it.end) + '</td><td>' + cell + '</td></tr>';
  });
  g += '</table>';

  // כוננות — שני סטים ביום: "עד 12:00" (בלוק קודם) ו"מ-12:00" (הבלוק הזה)
  var setBefore = standbySet_(prevBlock);
  var setAfter = standbySet_(block);
  var standbyHtml =
    '<div class="muted" style="margin-bottom:6px">עד 12:00</div>' +
    (setBefore.length ? chipsHtml_(setBefore, 'guard') : '<p class="muted">— (אין בלוק קודם)</p>') +
    '<div class="muted" style="margin:14px 0 6px">מ-12:00</div>' +
    chipsHtml_(setAfter, 'guard');

  // פטרול — רשימה מאוחדת (בלי הפרדת בוקר/ערב), כל חייל פעם אחת
  var pSeen = {}, patrol = [];
  block.patrol.forEach(function (it) {
    if (!pSeen[it.soldier_id]) { pSeen[it.soldier_id] = 1; patrol.push(it.soldier_name); }
  });

  return '<div class="block-title">' + hebDay(startDate) + ' ' + fmtDM(startDate) + ' · 00:00 → ' + fmtDM(addDays(startDate, 1)) + ' 12:00 <span class="muted" style="font-weight:400">(36 שעות)</span></div>' +
    '<div class="card"><h2>🎯 עמדה</h2>' + g + '</div>' +
    '<div class="card"><h2>🔴 כוננות</h2>' + standbyHtml + '</div>' +
    '<div class="card"><h2>🚶 פטרול</h2>' + chipsHtml_(patrol, 'patrol') + '</div>';
}

function renderBlock(block, myId, editable) {
  var g = '<table><tr><th>משמרת</th><th>שעות</th><th>חייל</th>' + (editable ? '<th></th>' : '') + '</tr>';
  block.guard.forEach(function (it) {
    g += '<tr class="row-guard ' + (it.soldier_id === myId ? 'mine' : '') + '">' +
         '<td>' + esc(it.day_label) + '</td>' +
         '<td>' + esc(it.start) + '–' + esc(it.end) + '</td>' +
         '<td>' + esc(it.soldier_name) + '</td>' +
         (editable ? '<td>' + editSelect(block.block_date, 'guard', it.slot, it.soldier_id) + '</td>' : '') +
         '</tr>';
  });
  g += '</table>';

  var patrolNames = block.patrol.reduce(function (acc, it) {
    (acc[it.slot] = acc[it.slot] || []).push({ name: it.soldier_name, mine: it.soldier_id === myId, label: it.day_label });
    return acc;
  }, {});
  var p = '';
  Object.keys(patrolNames).forEach(function (slot) {
    var arr = patrolNames[slot];
    p += '<div style="margin-top:8px"><span class="pill patrol">פטרול · ' + esc(arr[0].label) + '</span> ' +
      arr.map(function (x) { return '<span class="' + (x.mine ? 'mine' : '') + '" style="padding:2px 4px">' + esc(x.name) + '</span>'; }).join('، ') +
      '</div>';
  });

  return '<div class="card"><div class="block-title">' + esc(block.block_date) +
    ' <span class="pill guard">כוננות: השומרים 12:00–12:00</span></div>' + g + p + '</div>';
}

function editSelect(blockDate, position, slot, currentId) {
  var opts = (STATE.boot.soldiers || []).filter(function (s) { return s.active + '' !== 'FALSE' && s.active !== false; })
    .map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === currentId ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    }).join('');
  return '<select class="edit-cell" data-date="' + esc(blockDate) + '" data-pos="' + esc(position) +
    '" data-slot="' + esc(slot) + '">' + opts + '</select>';
}

// ---- טיוטה (מנהל) ----
function viewDraft() {
  var b = STATE.boot;
  var eligible = (b.soldiers || []).filter(function (s) {
    return (s.active + '' !== 'FALSE' && s.active !== false) &&
           (s.guard_eligible + '' !== 'FALSE' && s.guard_eligible !== false);
  });
  var forceBox = '<details style="margin:8px 0"><summary class="muted" style="cursor:pointer">חייבים בפטרול בבלוק הבא (לא יעלו לעמדות)</summary>' +
    '<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:8px">' +
    eligible.map(function (s) {
      return '<label class="muted"><input type="checkbox" class="force-patrol" value="' + esc(s.id) + '" style="width:auto"> ' + esc(s.name) + '</label>';
    }).join('') + '</div></details>';

  var head = '<div class="card"><h2>ניהול טיוטה</h2>' +
    '<p class="muted">הטיוטה נראית רק לך. החיילים ימשיכו לראות את השיבוץ הקודם עד שתלחץ "אישור ופרסום".</p>' +
    forceBox +
    '<div class="btn-row">' +
    '<button id="btn-generate">ייצר שיבוץ הבא (24ש\')</button>' +
    '<button id="btn-generate-week" class="secondary">ייצר שבוע (7 ימים)</button>' +
    (b.hasDraft ? '<button id="btn-publish">✓ אישור ופרסום</button>' +
                  '<button class="danger" id="btn-discard">בטל טיוטה</button>' : '') +
    '</div></div>';

  if (!b.hasDraft) return head + '<div class="card"><p class="muted">אין טיוטה פעילה. לחץ "ייצר שיבוץ הבא" כדי ליצור את הבלוק הבא לפי הוגנות, או ערוך ופרסם.</p></div>';

  var banner = '<div class="banner">⚠️ טיוטה לא מפורסמת — שינויים כאן אינם גלויים לחיילים. ניתן לערוך כל משמרת שמירה ואז לאשר.</div>';
  var blocks = b.draft.map(function (block) { return renderBlock(block, '', true); }).join('');
  return head + banner + blocks;
}

function wireDraft() {
  var g = document.getElementById('btn-generate');
  if (g) g.onclick = function () {
    var forced = Array.prototype.map.call(document.querySelectorAll('.force-patrol:checked'),
      function (el) { return el.value; });
    g.disabled = true;
    callAdmin('generateNextRotation', [forced], function (res) {
      toast('נוצרה טיוטה לתאריך ' + res.blockDate); reload();
    });
  };
  var gw = document.getElementById('btn-generate-week');
  if (gw) gw.onclick = function () {
    gw.disabled = true;
    callAdmin('generateWeek', [7], function (res) {
      toast('נוצרה טיוטה ל-' + res.days + ' ימים'); reload();
    });
  };
  var p = document.getElementById('btn-publish');
  if (p) p.onclick = function () {
    if (!confirm('לפרסם את הטיוטה לכל החיילים?')) return;
    callAdmin('publishDraft', [], function () { toast('פורסם בהצלחה ✓'); reload(); });
  };
  var d = document.getElementById('btn-discard');
  if (d) d.onclick = function () {
    if (!confirm('לבטל את הטיוטה?')) return;
    callAdmin('discardDraft', [], function () { toast('הטיוטה בוטלה'); reload(); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('.edit-cell'), function (sel) {
    sel.onchange = function () {
      callAdmin('editAssignment', [sel.getAttribute('data-date'), sel.getAttribute('data-pos'),
        sel.getAttribute('data-slot'), sel.value], function () { toast('עודכן'); reload(); });
    };
  });
}

// ---- חיילים (מנהל) ----
function viewSoldiers() {
  var soldiers = STATE.boot.soldiers || [];
  var rows = soldiers.map(function (s) {
    var inactive = (s.active + '' === 'FALSE' || s.active === false);
    return '<tr class="' + (inactive ? 'inactive' : '') + '">' +
      '<td>' + esc(s.name) + (s.internal_note ? ' <span class="muted" title="' + esc(s.internal_note) + '">🔒</span>' : '') + '</td>' +
      '<td class="kv">' + (esc(s.phone) || '—') + '</td>' +
      '<td class="kv">' + (esc(s.email) || '—') + '</td>' +
      '<td>' + roleName(s.role) + '</td>' +
      '<td>' + (s.guard_eligible + '' !== 'FALSE' && s.guard_eligible !== false ? 'כן' : 'לא') + '</td>' +
      '<td><div class="joinleave">' +
        '<label class="kv">מצטרף<input type="datetime-local" class="sd-start" data-id="' + esc(s.id) + '" value="' + toDTLocal(s.start_date) + '"></label>' +
        '<label class="kv">עוזב<input type="datetime-local" class="sd-end" data-id="' + esc(s.id) + '" value="' + toDTLocal(s.end_date) + '"></label>' +
        '</div></td>' +
      '<td>' + (inactive ? 'לא פעיל' :
        '<button class="danger secondary" data-remove="' + esc(s.id) + '" style="padding:4px 10px;font-size:12px">הורד</button>') +
      '</td></tr>';
  }).join('');

  return '<div class="card"><h2>הוספת חייל</h2>' +
    '<div class="form-grid">' +
    '<input id="ns-name" placeholder="שם מלא">' +
    '<input id="ns-phone" placeholder="טלפון (לוואטסאפ)">' +
    '<input id="ns-email" placeholder="מייל (לא חובה)">' +
    '<select id="ns-role"><option value="soldier">חייל</option><option value="officer">קצין מוצב</option><option value="sergeant">סמל</option></select>' +
    '<label class="muted"><input type="checkbox" id="ns-guard" checked style="width:auto"> כשיר לעמדות</label>' +
    '<button id="btn-add">הוסף</button>' +
    '</div></div>' +
    '<div class="card"><h2>רשימת חיילים</h2>' +
    '<table><tr><th>שם</th><th>טלפון</th><th>מייל</th><th>תפקיד</th><th>עמדות</th><th>נוכחות בבסיס</th><th></th></tr>' + rows + '</table>' +
    '<p class="muted" style="margin-top:10px">🔒 = הערה פנימית (מוצגת רק לך). טלפון מוצג לכולם. <strong>נוכחות</strong>: הגדר מתי חייל <strong>מצטרף/עוזב</strong> — מחוץ לחלון הוא לא ישובץ. ריק בשניהם = קבוע בבסיס. משפיע על "ייצר שבוע".</p></div>';
}

function wireSoldiers() {
  var add = document.getElementById('btn-add');
  if (add) add.onclick = function () {
    var name = document.getElementById('ns-name').value.trim();
    if (!name) { toast('חסר שם', true); return; }
    callAdmin('addSoldier', [name, document.getElementById('ns-email').value.trim(),
      document.getElementById('ns-role').value, document.getElementById('ns-guard').checked,
      document.getElementById('ns-phone').value.trim()],
      function () { toast('נוסף'); reload(); });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'), function (btn) {
    btn.onclick = function () {
      if (!confirm('להוריד את החייל? (יסומן כלא פעיל, ההיסטוריה נשמרת)')) return;
      callAdmin('removeSoldier', [btn.getAttribute('data-remove')], function () { toast('הורד'); reload(); });
    };
  });
  function wireWindow(cls, field) {
    Array.prototype.forEach.call(document.querySelectorAll(cls), function (inp) {
      inp.onchange = function () {
        var fields = {};
        fields[field] = fromDTLocal(inp.value);
        callAdmin('updateSoldier', [inp.getAttribute('data-id'), fields], function () { toast('עודכן'); reload(); });
      };
    });
  }
  wireWindow('.sd-start', 'start_date');
  wireWindow('.sd-end', 'end_date');
}

// "2026-07-13 12:00" (או תאריך בלבד) → ערך datetime-local "2026-07-13T12:00"
function toDTLocal(s) {
  if (!s) return '';
  s = String(s).replace(' ', 'T');
  if (s.indexOf('T') < 0) s += 'T00:00';
  return s.slice(0, 16);
}
// ערך datetime-local → מחרוזת לגיליון "2026-07-13 12:00" (ריק = ניקוי החלון)
function fromDTLocal(v) { return v ? String(v).replace('T', ' ') : ''; }

// ---- הוגנות (מנהל) ----
function viewFairness() {
  var b = STATE.boot;
  var useDraft = STATE.includeDraft && b.hasDraft;
  var statsSrc = useDraft ? (b.statsDraft || b.stats) : b.stats;
  var dutySrc = useDraft ? (b.dutyDraft || b.duty) : b.duty;

  var toggle = b.hasDraft
    ? '<div class="card" style="padding:12px 16px"><label class="muted" style="cursor:pointer"><input type="checkbox" id="fair-draft" ' + (STATE.includeDraft ? 'checked' : '') + ' style="width:auto"> כלול את הטיוטה בחישוב (תצוגה צפויה)</label></div>'
    : '';

  var stats = (statsSrc || []).slice().sort(function (a, c) {
    return Number(a.cumulative_guard_hours) - Number(c.cumulative_guard_hours);
  });
  if (!stats.length) return toggle + '<div class="card"><p class="muted">אין עדיין נתונים.</p></div>';
  var rows = stats.map(function (s) {
    return '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.cumulative_guard_hours) +
      '</td><td>' + esc(s.guard_blocks) + '</td><td class="kv">' + (esc(s.last_guard_block) || '—') + '</td></tr>';
  }).join('');
  var fairnessCard = '<div class="card"><h2>צבירת שעות שמירה' + (useDraft ? ' <span class="pill count">כולל טיוטה</span>' : '') + '</h2>' +
    '<p class="muted">האלגוריתם מעלה לשמירה את מי שצבר הכי מעט שעות. מיון מהנמוך לגבוה.</p>' +
    '<table><tr><th>חייל</th><th>שעות מצטברות</th><th>מס\' בלוקים</th><th>שמירה אחרונה</th></tr>' + rows + '</table></div>';

  var duty = (dutySrc || []).slice().sort(function (a, c) { return Number(c.guard_hours) - Number(a.guard_hours); });
  var dutyCard = '';
  if (duty.length) {
    var drows = duty.map(function (d) {
      return '<tr><td>' + esc(d.name) + '</td><td>' + esc(d.guard_hours) + '</td><td>' + esc(d.standby_hours) +
        '</td><td>' + esc(d.patrol_count) + '</td></tr>';
    }).join('');
    dutyCard = '<div class="card"><h2>עומסים: עמדה/כוננות מול פטרול</h2>' +
      '<p class="muted">שעות עמדה = סכום משמרות השמירה. כוננות = ימי-שמירה × 24. פטרול נספר במשמרות בוקר/ערב (לא בשעות — הן לא מדויקות).</p>' +
      '<table><tr><th>חייל</th><th>שעות עמדה</th><th>שעות כוננות</th><th>משמרות פטרול (בוקר/ערב)</th></tr>' + drows + '</table></div>';
  }

  // כרטיס יום/לילה: לילה = 00:00–06:00. יעד ~25% לכל שומר עמדות.
  var dn = (dutySrc || []).filter(function (d) { return (Number(d.day_shifts) + Number(d.night_shifts)) > 0; })
    .map(function (d) { var tot = Number(d.day_shifts) + Number(d.night_shifts); return { name: d.name, day: Number(d.day_shifts), night: Number(d.night_shifts), pct: Math.round(d.night_shifts / tot * 100) }; })
    .sort(function (a, c) { return c.pct - a.pct; });
  var dnCard = '';
  if (dn.length) {
    var dnrows = dn.map(function (d) {
      var off = Math.abs(d.pct - 25) > 15;
      return '<tr><td>' + esc(d.name) + '</td><td>' + d.day + '</td><td>' + d.night +
        '</td><td style="' + (off ? 'color:var(--danger);font-weight:600' : 'color:var(--patrol)') + '">' + d.pct + '%</td></tr>';
    }).join('');
    dnCard = '<div class="card"><h2>יום / לילה' + (useDraft ? ' <span class="pill count">כולל טיוטה</span>' : '') + '</h2>' +
      '<p class="muted">לילה = משמרת שמתחילה 00:00–06:00. היעד: ~25% לילות לכל שומר עמדות (אדום = חריגה מ-25% ביותר מ-15 נק\').</p>' +
      '<table><tr><th>חייל</th><th>משמרות יום</th><th>משמרות לילה</th><th>% לילה</th></tr>' + dnrows + '</table></div>';
  }

  return toggle + fairnessCard + dutyCard + dnCard;
}

function wireFairness() {
  var c = document.getElementById('fair-draft');
  if (c) c.onchange = function () { STATE.includeDraft = c.checked; render(); };
}

// ---- עזר ----
function truthy(v) { return v === true || v + '' === 'TRUE' || v + '' === 'true'; }
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function addDays(s, n) {
  var p = String(s).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
var HEB_DAYS = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
function hebDay(s) { var p = String(s).split('-'); return HEB_DAYS[new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2])).getDay()]; }
function fmtDM(s) { var p = String(s).split('-'); return p[2] + '/' + p[1]; }
function hhToMin(hh) {
  var m = String(hh || '').match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return (parseInt(m[1], 10) % 24) * 60 + parseInt(m[2], 10);
}
